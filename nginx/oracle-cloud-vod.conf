# ==============================================================================
# PARTYSTREAM — CẤU HÌNH NGINX STREAMING TRÊN ORACLE CLOUD (OCI COMPUTE INSTANCE)
# Hệ điều hành khuyến nghị: Ubuntu 22.04/24.04 LTS hoặc Oracle Linux 8/9
# File vị trí trên VPS: /etc/nginx/sites-available/partystream-vod.conf
# ==============================================================================

# 1. Cấu hình chuyển hướng toàn bộ HTTP (Port 80) sang HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name vod.yourcompany.vn; # Thay bằng tên miền hoặc IP tĩnh của bạn

    # Cho phép Certbot xác thực chứng chỉ Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Cấu hình máy chủ Media Streaming HTTPS (Port 443 với HTTP/2)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vod.yourcompany.vn;

    # Đường dẫn chứng chỉ SSL (Let's Encrypt Certbot sinh tự động)
    ssl_certificate /etc/letsencrypt/live/vod.yourcompany.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vod.yourcompany.vn/privkey.pem;

    # Cấu hình chuẩn mã hóa SSL/TLS hiện đại & bảo mật cao
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Thư mục gốc chứa video và phụ đề trên VPS Oracle Cloud
    # Gợi ý: Tạo thư mục bằng lệnh: sudo mkdir -p /var/www/partystream/{videos,subtitles,thumbnails}
    root /var/www/partystream;

    # Tối ưu hóa I/O cho việc truyền file media dung lượng lớn
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Bảo mật Anti-SEO: Chặn Google Bot lập chỉ mục máy chủ lưu trữ video
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    # --------------------------------------------------------------------------
    # A. PHỤC VỤ STREAMING VIDEO (.mp4, .webm, .m4v)
    # Hỗ trợ module ngx_http_mp4_module và HTTP 206 Range Requests (Tua nhanh)
    # --------------------------------------------------------------------------
    location /videos/ {
        alias /var/www/partystream/videos/;

        # Kích hoạt module MP4 của Nginx
        mp4;
        mp4_buffer_size       2m;
        mp4_max_buffer_size   15m;

        # Bắt buộc bật Accept-Ranges để trình duyệt / ArtPlayer thực hiện tua mượt mà
        add_header Accept-Ranges bytes always;

        # Cấu hình CORS để Web chạy trên Vercel gọi được tài nguyên video
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Content-Type, Accept" always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Lưu cache trình duyệt 30 ngày cho các file video tĩnh
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # --------------------------------------------------------------------------
    # B. PHỤC VỤ PHỤ ĐỀ VIDEO (.vtt, .srt)
    # Trình duyệt yêu cầu header Content-Type chính xác và CORS đầy đủ
    # --------------------------------------------------------------------------
    location /subtitles/ {
        alias /var/www/partystream/subtitles/;

        types {
            text/vtt vtt;
            text/plain srt txt;
        }
        charset utf-8;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Content-Type, Accept" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # --------------------------------------------------------------------------
    # C. PHỤC VỤ ẢNH BÌA VIDEO THUMBNAILS (.jpg, .png, .webp)
    # --------------------------------------------------------------------------
    location /thumbnails/ {
        alias /var/www/partystream/thumbnails/;

        add_header Access-Control-Allow-Origin "*" always;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
